#  For more information about TARDIS pipelines, please refer to:
#
#    https://tardis-sn.github.io/tardis/development/continuous_integration.html

name: tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
  workflow_call:
    inputs:
      pip_git:
        description: "Whether or not to install tardis using git"
        required: false
        type: boolean
        default: false

env:
  CACHE_NUMBER: 0  # increase to reset cache manually
  PYTEST_FLAGS: --tardis-regression-data=${{ github.workspace }}/tardis-regression-data --cov=tardis --cov-report=xml --cov-report=html --cov-append
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

defaults:
  run:
    shell: bash -l {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  arch-probe-no-pin:
    name: "probe-NO-PIN-${{ matrix.run_id }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_id: [1, 2, 3, 4, 5]
    steps:
      - name: Detect CPU architecture level
        run: |
          echo "===== RUN ${{ matrix.run_id }} — NO NUMBA PIN ====="
          echo ""
          echo "--- uname ---"
          uname -a
          echo ""
          echo "--- /proc/cpuinfo model name ---"
          grep "model name" /proc/cpuinfo | head -1
          echo ""
          echo "--- CPU flags (AVX/AVX2/AVX-512) ---"
          grep -oP '(avx512\w*|avx2|avx|sse4_2|fma)' /proc/cpuinfo | sort -u
          echo ""
          echo "--- __archspec from conda (if available) ---"
          conda info 2>/dev/null | grep -i arch || echo "conda not available"
          echo ""
          echo "--- ld.so hwcap / platform detection ---"
          LD_SHOW_AUXV=1 /bin/true | grep -i -E 'platform|hwcap' || true
          echo ""
          echo "--- gcc -march=native -Q --help=target (first 20 lines) ---"
          gcc -march=native -Q --help=target 2>/dev/null | grep -E '^\s+-(mavx|msse|mfma)' || echo "gcc not available"
          echo ""
          echo "--- Azure region / runner info ---"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          curl -s -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              c = d.get('compute', {})
              print(f\"Azure location: {c.get('location', 'unknown')}\")
              print(f\"VM size: {c.get('vmSize', 'unknown')}\")
          except: print('Could not fetch Azure metadata')
          "

  arch-probe-with-pin:
    name: "probe-HASWELL-PIN-${{ matrix.run_id }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_id: [1, 2, 3, 4, 5]
    env:
      NUMBA_CPU_NAME: haswell
    steps:
      - name: Detect CPU architecture level
        run: |
          echo "===== RUN ${{ matrix.run_id }} — NUMBA_CPU_NAME=haswell ====="
          echo ""
          echo "--- uname ---"
          uname -a
          echo ""
          echo "--- /proc/cpuinfo model name ---"
          grep "model name" /proc/cpuinfo | head -1
          echo ""
          echo "--- CPU flags (AVX/AVX2/AVX-512) ---"
          grep -oP '(avx512\w*|avx2|avx|sse4_2|fma)' /proc/cpuinfo | sort -u
          echo ""
          echo "--- __archspec from conda (if available) ---"
          conda info 2>/dev/null | grep -i arch || echo "conda not available"
          echo ""
          echo "--- ld.so hwcap / platform detection ---"
          LD_SHOW_AUXV=1 /bin/true | grep -i -E 'platform|hwcap' || true
          echo ""
          echo "--- gcc -march=native -Q --help=target (first 20 lines) ---"
          gcc -march=native -Q --help=target 2>/dev/null | grep -E '^\s+-(mavx|msse|mfma)' || echo "gcc not available"
          echo ""
          echo "--- Azure region / runner info ---"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          curl -s -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              c = d.get('compute', {})
              print(f\"Azure location: {c.get('location', 'unknown')}\")
              print(f\"VM size: {c.get('vmSize', 'unknown')}\")
          except: print('Could not fetch Azure metadata')
          "
          echo ""
          echo "--- NUMBA_CPU_NAME is set to: $NUMBA_CPU_NAME ---"
          echo "--- Numba will generate AVX2 (v3) code regardless of actual CPU ---"
